# Link3 · servidor (Hostinger KVM 4). Rodar em /opt/link3/deploy:  docker compose up -d
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports: ["5678:5678"]
    env_file: n8n.env
    volumes: [n8n_data:/home/node/.n8n]

  worker:
    build: ../worker
    restart: unless-stopped
    env_file: worker.env
    volumes: [work:/work]
    profiles: ["worker"]   # só sobe com: docker compose --profile worker up -d (depois de preencher worker.env)

volumes:
  n8n_data:
  work:
