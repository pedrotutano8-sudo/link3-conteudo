# Link3 · servidor (Hostinger KVM 4). Rodar em /opt/link3/deploy:  docker compose up -d
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports: ["${N8N_BIND:-0.0.0.0}:5678:5678"]   # https.sh troca pra 127.0.0.1 (só o Caddy acessa)
    env_file: n8n.env
    volumes: [n8n_data:/home/node/.n8n]

  worker:
    build: ../worker
    restart: unless-stopped
    env_file: worker.env
    volumes: [work:/work, ../trilhas:/trilhas:ro]   # trilhas de fundo licenciadas: /opt/link3/trilhas
    profiles: ["worker"]   # só sobe com: docker compose --profile worker up -d (depois de preencher worker.env)

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, ../painel:/srv/painel:ro, caddy_data:/data]
    profiles: ["https"]    # sobe com: bash https.sh n8n.seudominio.com.br

volumes:
  caddy_data:
  n8n_data:
  work:
