<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link3 · Conteúdo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23141414'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='%23F0C41D' font-family='Arial' font-weight='800'>L3</text></svg>">
<style>
  :root { --bg:#f6f5f1; --panel:#fff; --ink:#161614; --mute:#6c6a63; --line:#e5e3dc; --acc:#f0c41d; --acc-ink:#5c4700; --acc-soft:#fdf6d8;
          --red:#b42318; --red-soft:#fdecea; --green:#067647; --green-soft:#e7f6ee; --blue:#1d4ed8; --blue-soft:#e8efff; --amber:#b54708; --amber-soft:#fef4e6; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:18px; padding:10px 24px; background:var(--ink); color:#fff; position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header .marca { font-weight:800; letter-spacing:.2px; } header .marca b { color:var(--acc); }
  nav { display:flex; gap:2px; } nav button { background:none; border:0; color:#bdbbb3; padding:7px 11px; border-radius:7px; cursor:pointer; font:inherit; }
  nav button.on { background:#2a2a27; color:#fff; font-weight:600; } nav button .n { background:var(--acc); color:var(--ink); border-radius:9px; padding:0 6px; font-size:11px; font-weight:700; margin-left:4px; }
  header .grow { flex:1; } header .quem { color:#bdbbb3; font-size:12px; } header .btn { background:#2a2a27; color:#fff; border-color:#3a3a36; }
  main { max-width:1180px; margin:0 auto; padding:22px 24px 60px; }
  h2 { font-size:18px; margin:0 0 14px; } h3 { font-size:14px; margin:18px 0 8px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  .pad { padding:16px 18px; }
  table { width:100%; border-collapse:collapse; } th { text-align:left; font-size:12px; color:var(--mute); font-weight:500; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; } tr:last-child td { border-bottom:0; }
  tr.click { cursor:pointer; } tr.click:hover td { background:#faf9f5; }
  .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tag { display:inline-block; padding:2px 8px; border-radius:6px; font-size:12px; font-weight:500; white-space:nowrap; }
  .s-fila { background:#f1f0ec; color:var(--mute); } .s-rodando { background:var(--blue-soft); color:var(--blue); } .s-voce { background:var(--acc-soft); color:var(--acc-ink); }
  .s-ok { background:var(--green-soft); color:var(--green); } .s-erro { background:var(--red-soft); color:var(--red); }
  input, select, textarea { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); width:100%; }
  textarea { min-height:84px; resize:vertical; } input[type=color] { padding:2px; height:38px; width:56px; } input[type=checkbox], input[type=radio] { width:auto; }
  label.f { display:block; font-size:12px; color:var(--mute); margin:12px 0 5px; }
  .btn { font:inherit; padding:8px 13px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; white-space:nowrap; }
  .btn.pri { background:var(--ink); color:#fff; border-color:var(--ink); } .btn.acc { background:var(--acc); border-color:var(--acc); font-weight:600; }
  .btn.red { color:var(--red); } .btn:disabled { opacity:.5; cursor:default; } .btn.sm { padding:4px 9px; font-size:12px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .row > .grow { flex:1; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; } .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:860px) { .grid2, .grid3 { grid-template-columns:1fr; } main { padding:14px; } .hide-sm { display:none; } }
  .mute { color:var(--mute); } .small { font-size:12px; } .empty { padding:30px; text-align:center; color:var(--mute); }
  .login { max-width:360px; margin:12vh auto; padding:28px; } .login h1 { font-size:20px; margin:0 0 4px; } .login input { margin-top:12px; } .login .btn { width:100%; margin-top:14px; }
  dialog { border:1px solid var(--line); border-radius:14px; padding:0; width:min(860px,96vw); max-height:92vh; }
  dialog .topo { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; z-index:1; }
  dialog .corpo { padding:16px 18px; overflow:auto; }
  .tipos { display:flex; gap:8px; } .tipos label { flex:1; border:1px solid var(--line); border-radius:10px; padding:12px; cursor:pointer; text-align:center; }
  .tipos input { display:none; } .tipos label:has(input:checked) { border-color:var(--ink); background:#faf9f5; font-weight:600; }
  .hist { list-style:none; margin:0; padding:0; } .hist li { padding:6px 0; border-bottom:1px dashed var(--line); font-size:13px; display:flex; gap:10px; } .hist li:last-child { border:0; }
  .pergunta { background:var(--acc-soft); border:1px solid #f3e19a; border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .previa { background:#111; border-radius:10px; display:flex; justify-content:center; }
  .laminas { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; padding:8px; width:100%; background:#f4f2ee; }
  .laminas a { position:relative; display:block; } .laminas img { width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:6px; display:block; max-height:none; }
  .laminas span { position:absolute; left:6px; top:6px; background:rgba(0,0,0,.6); color:#fff; font-size:11px; padding:1px 6px; border-radius:9px; } .previa video, .previa img { max-height:60vh; max-width:100%; border-radius:10px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; } .card .k { font-size:12px; color:var(--mute); } .card .v { font-size:22px; font-weight:650; }
  .mock { width:180px; aspect-ratio:9/16; border-radius:14px; position:relative; overflow:hidden; background:linear-gradient(160deg,#5b6170,#2b2f38); flex-shrink:0; }
  .mock .leg { position:absolute; left:10px; right:10px; text-align:center; font-weight:800; font-size:15px; line-height:1.15; }
  .mock .leg span { padding:2px 5px; border-radius:4px; } .mock .logo { position:absolute; top:10px; right:10px; width:34px; height:34px; object-fit:contain; }
  .ativo { display:flex; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; } .ativo:last-child { border:0; }
  .chip { display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:middle; border:1px solid rgba(0,0,0,.15); }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 14px; border-radius:8px; font-size:13px; display:none; z-index:30; }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"><div class="topo"><strong id="dlgTitulo"></strong><span class="grow" style="flex:1"></span><button class="btn sm" onclick="fecharDlg()">Fechar</button></div><div class="corpo" id="dlgCorpo"></div></dialog>
<div class="toast" id="toast"></div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const cfg = window.LINK3 || {};
const sb = supabase.createClient(cfg.url, cfg.anonKey);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const quando = (d) => d ? new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const usd = (n) => 'US$ ' + Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 2800); };
const fecharDlg = () => { $('#dlg').close(); S.aberto = null; };
// aceita link do Drive ou o id puro
const idDrive = (v) => { v = String(v || '').trim(); const m = v.match(/\/d\/([\w-]{10,})/) || v.match(/[?&]id=([\w-]{10,})/) || v.match(/folders\/([\w-]{10,})/); return m ? m[1] : v; };
const linkDrive = (id, pasta) => id ? `https://drive.google.com/${pasta ? 'drive/folders' : 'file/d'}/${id}` : '';

const STATUS = {
  na_fila: ['Na fila', 's-fila'], baixando: ['Baixando', 's-rodando'], preparando: ['Transcrevendo', 's-rodando'], planejando: ['Montando roteiro', 's-rodando'],
  aguardando_resposta: ['Pergunta para você', 's-voce'], renderizando: ['Renderizando', 's-rodando'], previa_pronta: ['Prévia pronta', 's-voce'],
  ajuste_pedido: ['Ajustando', 's-rodando'], aprovado: ['Aprovado', 's-rodando'], entregando: ['Enviando ao Drive', 's-rodando'],
  entregue: ['Entregue', 's-ok'], erro: ['Erro', 's-erro'], cancelado: ['Cancelado', 's-fila'],
};
const tag = (s) => `<span class="tag ${STATUS[s]?.[1] || ''}">${STATUS[s]?.[0] || s}</span>`;
const takesDoPedido = (j) => (Array.isArray(j.origens) && j.origens.length ? j.origens : [{ id: j.origem_drive_id, nome: j.origem_nome || 'vídeo principal' }]);
const TIPO = { reel: 'Reel', carrossel: 'Carrossel', post: 'Post', lote: 'Lote por roteiro' };
const ASSET = { logo: 'Logo principal', logo_branca: 'Logo branca', simbolo: 'Símbolo', fonte: 'Fonte', vinheta_abertura: 'Vinheta de abertura', vinheta_encerramento: 'Vinheta de encerramento', musica: 'Música', foto: 'Foto', manual: 'Manual de marca', referencia: 'Referência', outro: 'Outro' };

// Ficha de edição: cópia de worker/lib/estilos.js (mudou lá, mudar aqui)
// app da Meta (login unificado): ID do app e da configuração não são segredo; a chave secreta fica só no servidor
const META = { appId: '2212705102675144', configId: '2270334556865702', versao: 'v24.0', retorno: location.origin + '/instagram/retorno' };
const urlLoginInstagram = (clientId) => {
  const estado = (clientId || 'sem') + '.' + Math.random().toString(36).slice(2, 10);
  try { sessionStorage.setItem('igEstado', estado); } catch { /* sem armazenamento: confere só o formato */ }
  const q = new URLSearchParams({ client_id: META.appId, config_id: META.configId, redirect_uri: META.retorno, response_type: 'code', override_default_response_type: 'true', state: estado });
  return `https://www.facebook.com/${META.versao}/dialog/oauth?${q}`;
};
// volta do login da Meta: grava o code (o worker troca pelo token) e acompanha
async function retornoInstagram() {
  const q = new URLSearchParams(location.search);
  history.replaceState({}, '', '/');
  if (q.get('error')) return toast('Conexão do Instagram cancelada: ' + (q.get('error_description') || q.get('error')));
  const code = q.get('code'), estado = q.get('state') || '';
  let esperado = null; try { esperado = sessionStorage.getItem('igEstado'); sessionStorage.removeItem('igEstado'); } catch { /* */ }
  if (!code || (esperado && esperado !== estado)) return toast('Volta do Instagram inválida. Tente conectar de novo.');
  const clientId = /^[0-9a-f-]{36}$/.test(estado.split('.')[0]) ? estado.split('.')[0] : null;
  const { data, error } = await sb.from('instagram_conexoes').insert({ code, client_id: clientId }).select('id').single();
  if (error) return toast('Erro ao registrar a conexão: ' + error.message);
  toast('Conectando o Instagram… (leva alguns segundos)');
  for (let i = 0; i < 30; i++) {
    await new Promise((r) => setTimeout(r, 3000));
    const { data: c } = await sb.from('instagram_conexoes').select('status, erro, contas').eq('id', data.id).single();
    if (c?.status === 'ok') { toast('Instagram conectado: ' + (c.contas || []).map((x) => '@' + x.username).join(', ')); if (clientId) { S.aba = 'clientes'; render(); abrirCliente(clientId); } return; }
    if (c?.status === 'erro') return toast('O Instagram não conectou: ' + c.erro);
  }
  toast('A conexão está demorando. Confira em alguns minutos na ficha do cliente.');
}

// modelo do campo "Ajuste" (o worker lê RITMO e PALAVRAS-CHAVE em worker/lib/visual.js; TAKES e TIRAR vão para a IA de cortes)
const MODELO_AJUSTE = `TAKES: use só a parte em que ele fala "[começo da frase]" até "[fim da frase]".
TIRAR: corta o trecho em que ele fala "[frase que quer tirar]".
PALAVRAS-CHAVE: coloca as palavras "[palavra 1]", "[palavra 2]" e "[palavra 3]" passando por trás dele.
RITMO: deixa as transições mais rápidas e dinâmicas.`;
// modelo do Ajuste para carrossel e post (a IA muda só o que foi pedido no plano anterior)
const MODELO_AJUSTE_PECA = `LÂMINA [número]: troca o título por "[novo título]".
LÂMINA [número]: usa a foto "[nome do arquivo]".
TIRAR: tira a lâmina [número].
TEXTO: deixa os textos mais curtos e diretos.`;
const ELEMENTOS = { gancho: 'Título de abertura (gancho)', pb: 'Abertura em preto e branco', cartoes: 'B-roll em cartão flutuante (senão, tela cheia)', capitulos: 'Cartão de capítulo', impactos: 'Palavra de impacto', lista: 'Lista animada', citacao: 'Citação em destaque', tarja: 'Tarja de nome e cargo', encerramento: 'Encerramento com logo e chamada', trilha: 'Trilha de fundo', grade: 'Cor levemente quente', ritmo: 'Ritmo dinâmico (zoom e transição rápida nos cortes)', atras: 'Palavras-chave passando atrás da pessoa' };
const todos = (v) => Object.fromEntries(Object.keys(ELEMENTOS).map((k) => [k, v]));
const ESTILOS = {
  institucional: { nome: 'Institucional premium', descricao: 'Empresa, marca empregadora, serviço B2B. Abertura em P&B, B-roll em cartão, capítulos, tarja de nome e encerramento com logo. Ex.: GNX.', elementos: { ...todos(true), ritmo: false, atras: false } },
  criador: { nome: 'Criador / opinião', descricao: 'Pessoa falando de um assunto (notícia, opinião, dica). Corte seco, legenda grande, palavra de impacto e lista; B-roll em tela cheia; sem P&B, capítulo, tarja ou encerramento.', elementos: { ...todos(false), gancho: true, impactos: true, lista: true, citacao: true, trilha: true } },
  promocional: { nome: 'Promocional / varejo', descricao: 'Oferta, produto, evento. Gancho forte, palavra de impacto, lista de benefícios, B-roll em cartão e encerramento com chamada.', elementos: { ...todos(true), pb: false, capitulos: false, tarja: false, citacao: false, ritmo: false, atras: false } },
  simples: { nome: 'Simples (só legenda)', descricao: 'Cortes, legenda da marca, trilha e B-roll em tela cheia, sem camada de motion.', elementos: { ...todos(false), trilha: true } },
};
const fichaDoKit = (k) => { const ac = k?.acabamento || {}, f = ac.ficha || {}; const estilo = ESTILOS[f.estilo] ? f.estilo : ac.design?.ativo ? 'institucional' : 'simples';
  return { estilo, sobre: f.sobre || '', briefing: f.briefing || '', referencias: f.referencias || [], ajustes: f.ajustes || [], versao: f.versao || 0, elementos: { ...ESTILOS[estilo].elementos, ...(f.elementos || {}) } }; };
const CONFLITOS = [
  [/sem (m[uú]sica|trilha)|n[aã]o (quer|coloc\w*|usa\w*) (m[uú]sica|trilha)/i, 'trilha', 'O briefing pede sem música, mas a trilha está ligada.'],
  [/(sem|n[aã]o)\b[^.]{0,30}(preto e branco|p&b|pb\b)/i, 'pb', 'O briefing não quer preto e branco, mas a abertura em P&B está ligada.'],
  [/sem (logo|encerramento|cart[aã]o final|vinheta final)/i, 'encerramento', 'O briefing não quer encerramento com logo, mas ele está ligado.'],
  [/sem cap[ií]tulo/i, 'capitulos', 'O briefing não quer capítulo, mas ele está ligado.'],
  [/sem (tarja|nome na tela)/i, 'tarja', 'O briefing não quer tarja de nome, mas ela está ligada.'],
  [/sem (b-?roll|imagem de apoio)/i, 'cartoes', 'O briefing não quer B-roll em cartão, mas ele está ligado.'],
];
const conflitos = (texto, estilo, el) => { const out = CONFLITOS.filter(([re, k]) => re.test(texto) && el[k]).map((x) => x[2]);
  if (/sem (anima[cç][aã]o|motion|efeito)/i.test(texto) && estilo !== 'simples') out.push('O briefing não quer animação, mas o estilo escolhido tem camada de motion. Use o estilo "Simples".'); return out; };

const S = { aba: 'pedidos', perfil: null, clientes: [], kits: {}, jobs: [], filtro: { status: '', cliente: '' }, aberto: null };

async function iniciar() {
  if (!cfg.url || !cfg.anonKey) { $('#app').innerHTML = '<div class="box login"><h1>Configuração faltando</h1><p class="mute">Preencha o config.js com a URL e a chave pública do Supabase.</p></div>'; return; }
  sb.auth.onAuthStateChange((_e, s) => { if (s && !S.perfil) carregar(); if (!s) { S.perfil = null; telaLogin(); } });
  const { data } = await sb.auth.getSession();
  data.session ? carregar() : telaLogin();
}

function telaLogin() {
  $('#app').innerHTML = `<div class="box login"><h1>Link3 · Conteúdo</h1><p class="mute small">Entre com o e-mail e a senha que você recebeu.</p>
    <form id="fLogin"><input type="email" name="email" placeholder="seu@email.com" required autocomplete="username"><input type="password" name="senha" placeholder="Senha" required autocomplete="current-password">
    <button class="btn pri">Entrar</button></form><p class="small mute" id="msg"></p></div>`;
  $('#fLogin').onsubmit = async (e) => {
    e.preventDefault(); $('#msg').textContent = 'Entrando…';
    const { error } = await sb.auth.signInWithPassword({ email: e.target.email.value.trim(), password: e.target.senha.value });
    $('#msg').textContent = error ? 'E-mail ou senha inválidos.' : '';
  };
}

async function carregar() {
  const { data: u } = await sb.auth.getUser();
  const { data: perfil } = await sb.from('profiles').select('*').eq('id', u.user.id).maybeSingle();
  if (!perfil) { $('#app').innerHTML = `<div class="box login"><h1>Sem acesso</h1><p class="mute">O e-mail ${esc(u.user.email)} ainda não foi liberado no painel. Peça ao administrador.</p><button class="btn" onclick="sb.auth.signOut()">Sair</button></div>`; return; }
  S.perfil = perfil;
  await Promise.all([carregarClientes(), carregarJobs()]);
  if (location.pathname.startsWith('/instagram/retorno')) setTimeout(retornoInstagram, 300);
  sb.channel('pedidos').on('postgres_changes', { event: '*', schema: 'public', table: 'jobs' }, async () => { await carregarJobs(); if (S.aba === 'pedidos') renderConteudo(); if (S.aberto) abrirPedido(S.aberto, true); render(true); })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'questions' }, () => S.aberto && abrirPedido(S.aberto, true)).subscribe();
  render();
}
async function carregarClientes() {
  const [c, k] = await Promise.all([sb.from('clients').select('*').order('nome'), sb.from('brand_kits').select('*')]);
  S.clientes = c.data || []; S.kits = Object.fromEntries((k.data || []).map((x) => [x.client_id, x]));
}
async function carregarJobs() {
  const { data } = await sb.from('jobs').select('id, numero, client_id, tipo, origem_nome, origem_drive_id, comando, status, erro, custo_ia_usd, created_at, updated_at').order('created_at', { ascending: false }).limit(300);
  S.jobs = data || [];
}

function render(soMenu) {
  const pend = S.jobs.filter((j) => ['aguardando_resposta', 'previa_pronta', 'erro'].includes(j.status)).length;
  const abas = [['pedidos', 'Pedidos', pend], ['novo', 'Novo pedido'], ['clientes', 'Clientes'], ['publicacoes', 'Publicações'], ['relatorios', 'Relatórios'], ['teste', 'Teste às cegas'], ...(S.perfil.papel === 'admin' ? [['equipe', 'Equipe']] : [])];
  const menu = abas.map(([k, t, n]) => `<button data-aba="${k}" class="${S.aba === k ? 'on' : ''}">${t}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('');
  if (soMenu && $('nav')) { $('nav').innerHTML = menu; ligarMenu(); return; }
  $('#app').innerHTML = `<header><span class="marca">Link<b>3</b> · Conteúdo</span><nav>${menu}</nav><span class="grow"></span>
    <span class="quem">${esc(S.perfil.nome || S.perfil.email)} · ${S.perfil.papel}</span><button class="btn sm" id="sair">Sair</button></header><main id="conteudo"></main>`;
  $('#sair').onclick = () => sb.auth.signOut();
  ligarMenu(); renderConteudo();
}
function ligarMenu() { $$('nav button').forEach((b) => (b.onclick = () => { S.aba = b.dataset.aba; render(); })); }
function renderConteudo() { ({ pedidos: renderPedidos, novo: renderNovo, clientes: renderClientes, publicacoes: renderPublicacoes, relatorios: renderRelatorios, teste: renderTeste, equipe: renderEquipe })[S.aba](); }
const nomeCliente = (id) => S.clientes.find((c) => c.id === id)?.nome || '—';

// ================= Pedidos =================
function renderPedidos() {
  const f = S.filtro;
  const grupo = { voce: ['aguardando_resposta', 'previa_pronta', 'erro'], rodando: ['na_fila', 'baixando', 'preparando', 'planejando', 'renderizando', 'ajuste_pedido', 'aprovado', 'entregando'], fim: ['entregue', 'cancelado'] };
  const lista = S.jobs.filter((j) => (!f.cliente || j.client_id === f.cliente) && (!f.status || grupo[f.status].includes(j.status)));
  const mes = S.jobs.filter((j) => new Date(j.created_at).getMonth() === new Date().getMonth());
  const entregues = mes.filter((j) => j.status === 'entregue');
  const custo = mes.reduce((s, j) => s + Number(j.custo_ia_usd), 0);
  $('#conteudo').innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">Esperando você</div><div class="v">${S.jobs.filter((j) => grupo.voce.includes(j.status)).length}</div></div>
      <div class="card"><div class="k">Em produção</div><div class="v">${S.jobs.filter((j) => grupo.rodando.includes(j.status)).length}</div></div>
      <div class="card"><div class="k">Entregues no mês</div><div class="v">${entregues.length}</div></div>
      <div class="card"><div class="k">Custo de IA no mês</div><div class="v">${usd(custo)}</div></div>
      <div class="card"><div class="k">Custo médio por peça</div><div class="v">${entregues.length ? usd(entregues.reduce((s, j) => s + Number(j.custo_ia_usd), 0) / entregues.length) : '—'}</div></div>
    </div>
    <div class="row" style="margin-bottom:12px">
      <select id="fStatus" style="width:auto"><option value="">Todos</option><option value="voce" ${f.status === 'voce' ? 'selected' : ''}>Esperando você</option><option value="rodando" ${f.status === 'rodando' ? 'selected' : ''}>Em produção</option><option value="fim" ${f.status === 'fim' ? 'selected' : ''}>Finalizados</option></select>
      <select id="fCliente" style="width:auto"><option value="">Todos os clientes</option>${S.clientes.map((c) => `<option value="${c.id}" ${f.cliente === c.id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select>
      <span class="grow"></span><button class="btn acc" onclick="S.aba='novo';render()">Novo pedido</button>
    </div>
    <div class="box">${lista.length ? `<table><tr><th>#</th><th>Cliente</th><th>Peça</th><th class="hide-sm">Comando</th><th>Status</th><th class="hide-sm">Atualizado</th><th class="num hide-sm">Custo IA</th></tr>
      ${lista.map((j) => `<tr class="click" data-id="${j.id}"><td class="mute">${j.numero}</td><td>${esc(nomeCliente(j.client_id))}</td>
        <td>${TIPO[j.tipo]}<div class="small mute">${esc(j.origem_nome || '')}</div></td><td class="hide-sm small mute" style="max-width:280px">${esc((j.comando || '').slice(0, 90))}</td>
        <td>${tag(j.status)}</td><td class="small mute hide-sm">${quando(j.updated_at)}</td><td class="num small hide-sm">${usd(j.custo_ia_usd)}</td></tr>`).join('')}</table>`
      : `<div class="empty">${S.jobs.length ? 'Nenhum pedido neste filtro.' : 'Nenhum pedido ainda. Comece em “Novo pedido”.'}</div>`}</div>`;
  $('#fStatus').onchange = (e) => { f.status = e.target.value; renderPedidos(); };
  $('#fCliente').onchange = (e) => { f.cliente = e.target.value; renderPedidos(); };
  $$('tr.click').forEach((tr) => (tr.onclick = () => abrirPedido(tr.dataset.id)));
}

// roteiro em linguagem simples: aceita o formato do worker sem depender dele estar completo
function roteiroSimples(r) {
  if (!r) return '<p class="mute small">O roteiro aparece aqui quando a IA terminar.</p>';
  const it = [];
  if (r.titulo) it.push(`<li><b>Título de gancho:</b> ${esc(r.titulo)}</li>`);
  const trechos = r.trechos || r.cortes;
  if (Array.isArray(trechos)) it.push(`<li><b>Cortes:</b> ${trechos.length} trecho(s) mantidos${r.duracao_final ? `, reel final de ${Math.round(r.duracao_final)} s` : ''}${r.duracao_bruto ? ` (bruto de ${Math.round(r.duracao_bruto)} s)` : ''}</li>`);
  if (Array.isArray(r.removido) && r.removido.length) it.push(`<li><b>Erros de gravação tirados:</b> ${r.removido.map((t) => `“${esc(t)}”`).join(', ')}</li>`);
  if (Array.isArray(r.cenas)) r.cenas.forEach((c) => it.push(`<li><b>${esc(c.tipo || 'Cena')}</b>${c.inicio != null ? ` aos ${Number(c.inicio).toFixed(1)} s` : ''}: ${esc(c.texto || c.descricao || '')}</li>`));
  const NOME_LAYOUT = { capa: 'capa', texto: 'texto', lista: 'lista', numero: 'número', citacao: 'citação', foto: 'foto', cta: 'chamada final' };
  if (Array.isArray(r.laminas)) r.laminas.forEach((l, i) => it.push(`<li><b>Lâmina ${i + 1}</b> (${esc(NOME_LAYOUT[l.layout] || l.layout || '')}${l.foto != null && r.fotos?.[l.foto] ? `, foto ${esc(r.fotos[l.foto].nome)}${l.recorte ? ' recortada' : ''}` : ''}): ${esc(String(l.titulo || l.texto || '').replace(/\*/g, ''))}</li>`));
  const copy = r.copy || r.legenda;
  if (copy) it.push(`<li><b>Legenda do post:</b> <button class="btn sm" onclick="navigator.clipboard.writeText(this.nextElementSibling.innerText).then(() => toast('Legenda copiada'))">Copiar</button><div style="white-space:pre-wrap;margin-top:6px">${esc(copy)}</div></li>`);
  if (r.cta) it.push(`<li><b>CTA:</b> ${esc(r.cta)}</li>`);
  if (r.versao === 'lote') {
    const reels = (r.reels || []).map((x) => `<li><b>#${esc(x.numero ?? '')} ${esc(x.titulo)}</b> · ${x.takes.length} take(s): ${x.takes.map(esc).join(', ')}</li>`).join('');
    return `<p class="small">Roteiro lido: ${esc((r.roteiro_arquivo || []).join(', '))}</p><ul style="margin:0;padding-left:18px">${reels}</ul>${(r.sobras || []).length ? `<p class="small mute">Vídeos sem roteiro (não usados): ${r.sobras.map(esc).join(', ')}</p>` : ''}`;
  }
  if (r.versao === 'base') it.push('<li class="mute">Edição básica: enquadramento 9:16 e logo (sem IA).</li>');
  return it.length ? `<ul style="margin:0;padding-left:18px">${it.join('')}</ul>` : `<pre class="small" style="white-space:pre-wrap">${esc(JSON.stringify(r, null, 2))}</pre>`;
}

async function abrirPedido(id, recarregar) {
  S.aberto = id;
  const [{ data: j }, { data: ev }, { data: qs }] = await Promise.all([
    sb.from('jobs').select('*').eq('id', id).single(),
    sb.from('job_events').select('*').eq('job_id', id).order('id', { ascending: false }),
    sb.from('questions').select('*').eq('job_id', id).order('created_at'),
  ]);
  if (!j) return;
  let previa = '';
  if (j.previa_path) {
    const { data: u } = await sb.storage.from('previas').createSignedUrl(j.previa_path, 3600);
    if (u?.signedUrl) previa = /\.(mp4|mov|webm)$/i.test(j.previa_path) ? `<video src="${u.signedUrl}" controls playsinline></video>` : `<img src="${u.signedUrl}" alt="Prévia">`;
  }
  // carrossel e post: as lâminas uma a uma (a folha fica de reserva)
  if (Array.isArray(j.roteiro?.previas) && j.roteiro.previas.length && ['carrossel', 'post'].includes(j.tipo)) {
    const { data: us } = await sb.storage.from('previas').createSignedUrls(j.roteiro.previas, 3600);
    const ok = (us || []).filter((x) => x.signedUrl);
    if (ok.length) previa = `<div class="laminas">${ok.map((x, k) => `<a href="${x.signedUrl}" target="_blank" rel="noopener" title="Abrir a lâmina ${k + 1}"><img src="${x.signedUrl}" alt="Lâmina ${k + 1}" loading="lazy"><span>${k + 1}</span></a>`).join('')}</div>`;
  }
  const peca = ['carrossel', 'post'].includes(j.tipo);
  const abertas = (qs || []).filter((q) => !q.resposta);
  $('#dlgTitulo').innerHTML = `#${j.numero} · ${esc(nomeCliente(j.client_id))} · ${TIPO[j.tipo]} ${tag(j.status)}`;
  $('#dlgCorpo').innerHTML = `
    ${abertas.map((q) => `<div class="pergunta"><b>A IA perguntou:</b> ${esc(q.pergunta)}
      <div class="row" style="margin-top:8px">${(q.opcoes || []).map((o) => `<button class="btn sm resp" data-q="${q.id}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}
      <input class="respTxt" data-q="${q.id}" placeholder="Ou escreva a resposta e tecle Enter" style="flex:1;min-width:200px"></div></div>`).join('')}
    ${j.status === 'erro' ? `<div class="pergunta" style="background:var(--red-soft);border-color:#f5c2bd"><b>Erro:</b> ${esc(j.erro)}<div class="small mute">A equipe da Liderate já recebeu o alerta.</div></div>` : ''}
    <div class="grid2">
      <div>${previa ? `<div class="previa">${previa}</div>` : `<div class="box empty">${['entregue'].includes(j.status) ? 'Entregue no Drive.' : 'A prévia aparece aqui quando o render terminar.'}</div>`}
        ${j.final_drive_id ? `<p class="small"><a href="${linkDrive(j.final_drive_id, peca)}" target="_blank" rel="noopener">${peca ? 'Abrir a pasta com as lâminas no Drive' : 'Abrir o arquivo final no Drive'}</a>${S.perfil.papel === 'admin' ? ` · <a href="#" id="btnTeste">Pôr no teste às cegas</a>` : ''}</p>` : ''}
        ${j.final_drive_id && j.tipo !== 'lote' ? `<div id="igPublicar" class="small mute" style="margin-top:10px"></div>` : ''}</div>
      <div>
        <h3 style="margin-top:0">Comando</h3><p style="margin:0;white-space:pre-wrap">${esc(j.comando || '—')}</p>
        <p class="small mute">Arquivo: ${j.origem_drive_id ? `<a href="${linkDrive(j.origem_drive_id)}" target="_blank" rel="noopener">${esc(j.origem_nome || 'abrir no Drive')}</a>` : '—'}</p>
        ${Array.isArray(j.origens) && j.origens.length > 1 ? `<p class="small mute" style="margin-top:-4px">Takes, na ordem: ${j.origens.map((o, k) => `<a href="${linkDrive(o.id)}" target="_blank" rel="noopener">${k + 1}. ${esc(o.nome || 'take')}</a>${o.incluido ? ' <span class="tag s-voce">incluído</span>' : ''}`).join(' · ')}</p>` : ''}
        ${j.roteiro?.ficha ? `<p class="small mute" style="margin:6px 0 0">Ficha de edição usada: <b>${esc(j.roteiro.ficha.nome)}</b>${j.roteiro.ficha.versao ? ` · versão ${j.roteiro.ficha.versao}` : ''}${j.roteiro.ficha.ritmo ? ' · <b>ritmo dinâmico</b>' : ''}${j.roteiro.ficha.atras?.length ? ` · palavras atrás: <b>${esc(j.roteiro.ficha.atras.join(', '))}</b>` : ''}</p>` : ''}
        ${j.roteiro?.design?.atrasFaltou?.length ? `<p class="small" style="margin:4px 0 0;color:#b45309">Não deu para colocar atrás da pessoa: ${esc(j.roteiro.design.atrasFaltou.join(', '))} (a palavra não foi dita, ou cai no começo, no fim ou junto de outro elemento). Confira se escreveu igual à fala.</p>` : ''}
        <h3>Roteiro</h3>${roteiroSimples(j.roteiro)}
        ${j.status === 'previa_pronta' ? `<h3>Ajuste</h3><textarea id="ajuste" rows="7" placeholder="Um pedido por linha. Ex.: tira o trecho em que ele fala &quot;ééé, então&quot;"></textarea>
          <div class="small mute" style="margin-top:4px">Não sabe como escrever? <a href="#" id="btnModelo">Usar o modelo</a> e trocar o que está entre [colchetes].${peca ? ' As lâminas são numeradas na prévia.' : ' Copie as palavras exatas que a pessoa fala no vídeo.'}</div>
          <label class="small" style="display:block;margin-top:6px"><input type="checkbox" id="ajusteFicha"> Guardar na ficha da marca (vale para os próximos vídeos dela)</label>
          <div class="row" style="margin-top:10px"><button class="btn" id="btnAjuste">Pedir ajuste</button><span class="grow"></span><button class="btn acc" id="btnAprovar">Aprovar e enviar ao Drive</button></div>` : ''}
        ${j.tipo === 'reel' && ['previa_pronta', 'erro'].includes(j.status) ? `<details style="margin-top:14px"><summary class="small" style="cursor:pointer"><b>Incluir um take</b> (ex.: um take que ficou em outra pasta)</summary>
          <label class="f">Link do take no Drive</label><input id="takeLink" placeholder="https://drive.google.com/file/d/...">
          <label class="f">Onde ele entra</label><select id="takePos">${takesDoPedido(j).map((t, k) => `<option value="${k + 1}" ${k === takesDoPedido(j).length - 1 ? 'selected' : ''}>Depois de: ${esc(t.nome || 'take ' + (k + 1))}</option>`).join('')}<option value="0">No começo, antes de todos</option></select>
          <label class="f">O que esse take traz (opcional)</label><input id="takeObs" placeholder="Ex.: a frase sobre o tempo de contratação">
          <p class="small mute" style="margin:6px 0 0">O reel é refeito do zero com o take na posição escolhida (leva alguns minutos). A prévia atual fica no histórico.</p>
          <div class="row" style="margin-top:8px"><span class="grow"></span><button class="btn" id="btnTake">Incluir take e refazer</button></div></details>` : ''}
        <div class="row" style="margin-top:10px">${j.status === 'erro' ? '<button class="btn" id="btnReenviar">Tentar de novo</button>' : ''}
          ${!['entregue', 'cancelado', 'entregando'].includes(j.status) ? '<button class="btn sm red" id="btnCancelar">Cancelar pedido</button>' : ''}</div>
        <h3>Histórico</h3><ul class="hist">${(ev || []).map((e) => `<li><span class="mute small" style="width:92px;flex-shrink:0">${quando(e.criado_em)}</span><span>${STATUS[e.status]?.[0] || e.status}${e.mensagem ? ` · <span class="mute">${esc(e.mensagem)}</span>` : ''}</span></li>`).join('')}</ul>
        <p class="small mute">Custo de IA: ${usd(j.custo_ia_usd)} · ${j.tokens_entrada + j.tokens_saida} tokens · ${j.segundos_audio} s de áudio</p>
      </div>
    </div>`;
  if ($('#igPublicar')) igDoPedido(j);
  $('#btnTake') && ($('#btnTake').onclick = async () => {
    const id = idDrive($('#takeLink').value);
    if (!id) return toast('Cole o link do take no Drive');
    const b = $('#btnTake'); b.disabled = true;
    const { error } = await sb.rpc('adicionar_take', { p_job: j.id, p_drive_id: id, p_nome: null, p_depois: Number($('#takePos').value), p_obs: $('#takeObs').value.trim() || null });
    b.disabled = false;
    toast(error ? 'Erro: ' + error.message : 'Take incluído. O reel está sendo refeito.');
    if (!error) abrirPedido(j.id, true);
  });
  $('#btnTeste') && ($('#btnTeste').onclick = async (e) => {
    e.preventDefault();
    const { error } = await sb.from('teste_reels').insert({ drive_id: j.final_drive_id, origem: 'sistema', client_id: j.client_id, job_id: j.id, rodada: S.rodada || '1' });
    toast(error ? 'Erro: ' + error.message : 'Reel incluído no teste às cegas (rodada ' + (S.rodada || '1') + ')');
  });
  const responder = async (q, v) => { if (!v.trim()) return; const { error } = await sb.rpc('responder_pergunta', { p_pergunta: q, p_resposta: v.trim() }); toast(error ? 'Erro: ' + error.message : 'Resposta enviada'); abrirPedido(id, true); };
  $$('.resp').forEach((b) => (b.onclick = () => responder(b.dataset.q, b.dataset.v)));
  $$('.respTxt').forEach((i) => (i.onkeydown = (e) => e.key === 'Enter' && responder(i.dataset.q, i.value)));
  const acao = async (fn, args, ok) => { const { error } = await sb.rpc(fn, args); toast(error ? 'Erro: ' + error.message : ok); await carregarJobs(); abrirPedido(id, true); render(true); };
  $('#btnAprovar') && ($('#btnAprovar').onclick = () => acao('aprovar_job', { p_job: id }, 'Aprovado. O arquivo final vai para o Drive.'));
  $('#btnModelo') && ($('#btnModelo').onclick = (ev) => { ev.preventDefault(); const a = $('#ajuste');
    a.value = (a.value.trim() ? a.value.trim() + '\n' : '') + (peca ? MODELO_AJUSTE_PECA : MODELO_AJUSTE); a.focus(); a.scrollTop = 0; const k = a.value.indexOf('['); if (k >= 0) a.setSelectionRange(k, a.value.indexOf(']', k) + 1); });
  $('#btnAjuste') && ($('#btnAjuste').onclick = async () => {
    const t = $('#ajuste').value.trim(); if (!t) return toast('Descreva o ajuste');
    if (/\[[^\]]*\]/.test(t) && /\[(começo|fim|frase|palavra)/i.test(t)) return toast('Troque o que está entre [colchetes] (ou apague a linha que não quiser)');
    if ($('#ajusteFicha')?.checked) {
      const { data: kt } = await sb.from('brand_kits').select('acabamento').eq('client_id', j.client_id).maybeSingle();
      if (kt) {
        const ac = kt.acabamento || {}, fi = ac.ficha || {};
        // RITMO e PALAVRAS-CHAVE guardados na ficha ligam (ou desligam) o elemento da marca
        const el = { ...(fi.elementos || {}) };
        const lr = t.match(/^\s*ritmo\s*:(.*)$/im), la = t.match(/^\s*palavras?[\s-]*chaves?\s*:(.*)$/im);
        if (lr) el.ritmo = !/(calm|lent|normal|sem efeito|menos)/i.test(lr[1]);
        if (la) el.atras = !/^\s*(sem|nenhuma|tira|remove|desliga)/i.test(la[1]);
        const { error } = await sb.from('brand_kits').update({ acabamento: { ...ac, ficha: { ...fi, elementos: el, ajustes: [...(fi.ajustes || []), { data: new Date().toISOString(), texto: t, pedido: j.numero }], versao: (fi.versao || 0) + 1, atualizada_em: new Date().toISOString() } } }).eq('client_id', j.client_id);
        if (error) toast('Ajuste não entrou na ficha: ' + error.message); else await carregarClientes();
      }
    }
    acao('pedir_ajuste', { p_job: id, p_comando: t }, 'Ajuste enviado');
  });
  $('#btnReenviar') && ($('#btnReenviar').onclick = () => acao('reenviar_job', { p_job: id }, 'Pedido voltou para a fila'));
  $('#btnCancelar') && ($('#btnCancelar').onclick = async () => { const { error } = await sb.from('jobs').update({ status: 'cancelado' }).eq('id', id); toast(error ? 'Erro: ' + error.message : 'Pedido cancelado'); await carregarJobs(); abrirPedido(id, true); render(true); });
  if (!recarregar || !$('#dlg').open) $('#dlg').showModal();
}

// ================= Novo pedido =================
function renderNovo() {
  const ativos = S.clientes.filter((c) => c.ativo);
  if (!ativos.length) { $('#conteudo').innerHTML = `<div class="box empty">Cadastre um cliente primeiro.<br><br><button class="btn acc" onclick="S.aba='clientes';render()">Cadastrar cliente</button></div>`; return; }
  $('#conteudo').innerHTML = `<h2>Novo pedido</h2><form class="box pad" id="fNovo" style="max-width:720px">
    <label class="f">Cliente</label><select name="cliente" required><option value="">Escolha o cliente</option>${ativos.map((c) => `<option value="${c.id}">${esc(c.nome)}${S.kits[c.id] ? '' : ' (sem identidade cadastrada)'}</option>`).join('')}</select>
    <label class="f">Tipo de peça</label><div class="tipos">${Object.entries(TIPO).map(([k, t], i) => `<label><input type="radio" name="tipo" value="${k}" ${i ? '' : 'checked'}>${t}</label>`).join('')}</div>
    <label class="f">Arquivo no Google Drive</label><input name="arquivo" placeholder="Cole o link do vídeo ou da pasta de fotos no Drive">
    <div class="small mute" style="margin-top:4px" id="dicaArq">No Drive: botão direito no arquivo → Compartilhar → Copiar link.</div>
    <label class="f">Nome do arquivo (opcional)</label><input name="nome" placeholder="Ex.: depoimento-joao.mp4">
    <label class="f">Comando</label><textarea name="comando" placeholder="Ex.: reel de até 45 s, corta as pausas, gancho sobre clareamento nos 3 primeiros segundos, CTA para o WhatsApp no final"></textarea>
    <div id="avisoKit" class="small" style="margin-top:8px"></div>
    <div class="row" style="margin-top:14px"><span class="grow"></span><button class="btn acc">Enviar para a fila</button></div></form>`;
  const f = $('#fNovo');
  const dicas = { lote: 'Cole o link da PASTA com os vídeos brutos e o documento de roteiros (.docx, .pdf ou Google Docs). O sistema cria 1 pedido de reel por roteiro, juntando os takes de cada um.',
    carrossel: 'Opcional: link de uma PASTA com as fotos (e, se quiser, um documento com o texto), de uma foto ou de um documento. Sem link, a IA escreve a partir do comando.',
    post: 'Opcional: link de uma foto, de uma pasta com fotos ou de um documento com o texto. Sem link, a IA escreve a partir do comando.' };
  const exemplos = { lote: 'Opcional: instrução para todos os reels do lote. Ex.: até 60 s, CTA para o site',
    carrossel: 'Ex.: carrossel de 7 lâminas sobre como contratar mais rápido, tom direto, chamada final para o WhatsApp',
    post: 'Ex.: post sobre os 27 anos da empresa, com a foto da equipe, chamada para o site' };
  f.querySelectorAll('input[name=tipo]').forEach((r) => (r.onchange = () => { $('#dicaArq').textContent = dicas[f.tipo.value] || 'No Drive: botão direito no arquivo → Compartilhar → Copiar link.'; f.comando.placeholder = exemplos[f.tipo.value] || 'Ex.: reel de até 45 s, corta as pausas, gancho sobre clareamento nos 3 primeiros segundos, CTA para o WhatsApp no final'; }));
  f.cliente.onchange = () => { $('#avisoKit').innerHTML = f.cliente.value && !S.kits[f.cliente.value] ? '<span style="color:var(--amber)">Este cliente ainda não tem identidade cadastrada: a peça sai sem logo e com cores padrão.</span>' : ''; };
  f.onsubmit = async (e) => {
    e.preventDefault();
    const tipo = f.tipo.value, arq = idDrive(f.arquivo.value);
    if (tipo === 'reel' && !arq) return toast('Cole o link do vídeo bruto no Drive');
    if (tipo === 'lote' && !arq) return toast('Cole o link da pasta com os vídeos e o roteiro');
    if (tipo !== 'lote' && !f.comando.value.trim()) return toast('Escreva o comando do pedido');
    const btn = f.querySelector('button.acc'); btn.disabled = true;
    const { data, error } = await sb.from('jobs').insert({ client_id: f.cliente.value, tipo, origem_drive_id: arq || null, origem_nome: f.nome.value.trim() || null, comando: f.comando.value.trim(), created_by: S.perfil.id }).select('id').single();
    btn.disabled = false;
    if (error) return toast('Erro: ' + error.message);
    toast('Pedido na fila'); await carregarJobs(); S.aba = 'pedidos'; render(); abrirPedido(data.id);
  };
}

    $('#fichaAvisos').innerHTML = cs.length ? `<div class="pergunta" style="margin-top:10px"><b>Atenção:</b> ${cs.map(esc).join('<br>')}</div>` : '';
  };
  const desenharAjustes = () => {
    $('#fichaAjustes').innerHTML = ajustes.length ? ajustes.map((a, i) => `<li><span class="mute small" style="width:72px;flex-shrink:0">${a.data ? new Date(a.data).toLocaleDateString('pt-BR') : ''}</span><span style="flex:1">${esc(a.texto)}</span><button type="button" class="btn sm red" data-i="${i}">Tirar</button></li>`).join('') : '<li class="small mute">Nenhum ajuste guardado.</li>';
    $$('#fichaAjustes button').forEach((b) => (b.onclick = () => { ajustes.splice(Number(b.dataset.i), 1); desenharAjustes(); avisos(); }));
  };
  $('#btnAddAjuste').onclick = () => { const t = $('#novoAjuste').value.trim(); if (!t) return; ajustes.push({ data: new Date().toISOString(), texto: t }); $('#novoAjuste').value = ''; desenharAjustes(); avisos(); };
  $$('input[name=ficha_estilo]').forEach((r) => (r.onchange = () => { const e = ESTILOS[r.value].elementos; Object.keys(ELEMENTOS).forEach((x) => (f['el_' + x].checked = e[x])); avisos(); }));
  desenharAjustes(); avisos();

    e.preventDefault();
    const reg = { nome: f.nome.value.trim(), instagram: f.instagram.value.trim() || null, pasta_brutos_id: idDrive(f.brutos.value) || null, pasta_finalizados_id: idDrive(f.finalizados.value) || null,
      tom_voz: f.tom.value.trim() || null, ctas: f.ctas.value.split('\n').map((x) => x.trim()).filter(Boolean), regras: f.regras.value.trim() || null, ativo: f.ativo.checked };
    const r = id ? await sb.from('clients').update(reg).eq('id', id).select().single() : await sb.from('clients').insert(reg).select().single();
    if (r.error) return toast('Erro: ' + r.error.message);
    const kit = { client_id: r.data.id,
      cores: { principal: f.cor_principal.value, secundaria: f.cor_secundaria.value, fundo: f.cor_fundo.value, texto: f.cor_texto.value },
      fontes: { titulo: f.fonte_titulo.value.trim() || null, corpo: f.fonte_corpo.value.trim() || null },
      estilo_legenda: { posicao: f.leg_posicao.value, destaque: f.leg_destaque.value, palavras: Number(f.leg_palavras.value) || 3, caixa: f.leg_caixa.checked, maiusculas: f.leg_maiusculas.checked } };
    if (id) Object.assign(kit, { logo_id: f.logo_id.value || null, vinheta_abertura_id: f.vin_ab.value || null, vinheta_encerramento_id: f.vin_enc.value || null });
    kit.acabamento = { ...(k.acabamento || {}), ficha: { estilo: f.ficha_estilo.value, sobre: f.ficha_sobre.value.trim(), briefing: f.ficha_briefing.value.trim(),
      referencias: f.ficha_refs.value.split('\n').map((x) => x.trim()).filter(Boolean), elementos: elementosForm(), ajustes, versao: ficha.versao + 1, atualizada_em: new Date().toISOString() } };
    const rk = S.kits[r.data.id] ? await sb.from('brand_kits').update(kit).eq('client_id', r.data.id) : await sb.from('brand_kits').insert(kit);
    if (rk.error) return toast('Cliente salvo, mas a identidade deu erro: ' + rk.error.message);
    toast('Cliente salvo'); await carregarClientes(); renderClientes(); if (!id) abrirCliente(r.data.id);
  };
  if (id) {
    $('#btnUp').onclick = async () => {
      const arqs = [...$('#upArq').files]; if (!arqs.length) return toast('Escolha o arquivo');
      const tipo = $('#upTipo').value; $('#btnUp').disabled = true;
      for (const a of arqs) {
        const path = `${S.perfil.org_id}/${id}/${Date.now()}-${a.name.normalize('NFD').replace(/[^\w.-]+/g, '_')}`;
        const up = await sb.storage.from('marcas').upload(path, a, { contentType: a.type || undefined });
        if (up.error) { toast('Erro no envio: ' + up.error.message); continue; }
        const ins = await sb.from('brand_assets').insert({ client_id: id, tipo, nome: a.name, storage_path: path, mime: a.type, tamanho: a.size });
        if (ins.error) toast('Erro: ' + ins.error.message);
      }
      $('#btnUp').disabled = false; toast('Arquivos enviados'); abrirCliente(id);
    };
    $$('.delAsset').forEach((b) => (b.onclick = async () => {
      await sb.storage.from('marcas').remove([b.dataset.path]);
      const { error } = await sb.from('brand_assets').delete().eq('id', b.dataset.id);
      toast(error ? 'Erro: ' + error.message : 'Arquivo removido'); abrirCliente(id);
    }));
  }
  if (id) igDaFicha(id);
  if (!$('#dlg').open) $('#dlg').showModal();
}

// publicar o reel entregue no Instagram do cliente (o worker baixa do Drive e publica)
const STATUS_PUB = { na_fila: 'na fila', publicando: 'publicando…', publicada: 'publicado', erro: 'erro', cancelada: 'cancelado' };
async function igDoPedido(j) {
  const box = $('#igPublicar'); if (!box) return;
  const [{ data: contas, error }, { data: pubs }] = await Promise.all([
    sb.from('instagram_contas').select('id, username, client_id, ativo').eq('ativo', true),
    sb.from('publicacoes').select('id, status, permalink, erro, created_at, conta_id, agendada_para').eq('job_id', j.id).order('created_at', { ascending: false }),
  ]);
  if (error) { box.innerHTML = ''; return; }
  const jaSaiu = new Set((pubs || []).filter((p) => ['publicada', 'publicando'].includes(p.status) || (p.status === 'na_fila')).map((p) => p.conta_id));
  const doClienteTodas = (contas || []).filter((x) => x.client_id === j.client_id);
  const doCliente = doClienteTodas.filter((x) => !jaSaiu.has(x.id)); // não oferece publicar 2x na mesma conta
  const nomeConta = (cid) => '@' + ((contas || []).find((x) => x.id === cid)?.username || '?');
  const futuro = (p) => p.status === 'na_fila' && new Date(p.agendada_para) > new Date(Date.now() + 60000);
  const quandoPub = (p) => new Date(p.agendada_para).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const lista = (pubs || []).map((p) => `<div style="margin:2px 0">${nomeConta(p.conta_id)} · <b>${futuro(p) ? `agendado para ${quandoPub(p)}` : STATUS_PUB[p.status] || p.status}</b>${p.permalink ? ` · <a href="${esc(p.permalink)}" target="_blank" rel="noopener">ver no Instagram</a>` : ''}${p.erro ? ` · <span style="color:#b91c1c">${esc(p.erro)}</span>` : ''}${p.status === 'na_fila' ? ` · <a href="#" class="igCancelar" data-id="${p.id}">cancelar</a>` : ''}</div>`).join('');
  const emAndamento = (pubs || []).some((p) => (p.status === 'na_fila' && !futuro(p)) || p.status === 'publicando');
  const agora = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  box.classList.remove('mute');
  box.innerHTML = `<b>Instagram</b>${lista ? `<div style="margin-top:4px">${lista}</div>` : ''}
    ${!doClienteTodas.length ? `<p class="mute" style="margin:4px 0">Conecte o Instagram na ficha do cliente para publicar daqui.</p>`
      : !doCliente.length ? '' : `<label class="f" style="margin-top:6px">Legenda do post</label><textarea id="igLegenda" rows="4">${esc(j.roteiro?.copy || '')}</textarea>
        <div class="row" style="gap:8px;margin-top:6px;flex-wrap:wrap"><select id="igConta">${doCliente.map((x) => `<option value="${x.id}">@${esc(x.username)}</option>`).join('')}</select>
        <label class="small" style="display:flex;align-items:center;gap:6px">Quando <input type="datetime-local" id="igQuando" min="${agora}" style="width:auto"></label>
        <span class="grow"></span><button type="button" class="btn acc" id="igPub">Publicar agora</button></div>
        <div class="small mute" style="margin-top:4px">Deixe "Quando" em branco para publicar agora, ou escolha dia e hora para agendar.</div>`}`;
  $('#igQuando') && ($('#igQuando').oninput = () => { $('#igPub').textContent = $('#igQuando').value ? 'Agendar' : 'Publicar agora'; });
  $('#igPub') && ($('#igPub').onclick = async () => {
    const conta = $('#igConta').value, nome = $('#igConta').selectedOptions[0].textContent;
    const q = $('#igQuando').value ? new Date($('#igQuando').value) : null;
    if (q && q < new Date()) return toast('Escolha um horário no futuro');
    const quando = q ? q.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : null;
    if (!confirm(q ? `Agendar este ${TIPO[j.tipo].toLowerCase()} em ${nome} para ${quando}?` : `Publicar este ${TIPO[j.tipo].toLowerCase()} agora em ${nome}? Ele vai aparecer no perfil na hora.`)) return;
    $('#igPub').disabled = true;
    const { error } = await sb.from('publicacoes').insert({ job_id: j.id, client_id: j.client_id, conta_id: conta, legenda: $('#igLegenda').value, ...(q ? { agendada_para: q.toISOString() } : {}) });
    toast(error ? 'Erro: ' + error.message : q ? `Agendado para ${quando}.` : 'Na fila de publicação. Leva 1 a 3 minutos.');
    igDoPedido(j);
  });
  $$('.igCancelar').forEach((a) => (a.onclick = async (ev) => {
    ev.preventDefault();
    if (!confirm('Cancelar esta publicação?')) return;
    const { error } = await sb.from('publicacoes').update({ status: 'cancelada' }).eq('id', a.dataset.id).eq('status', 'na_fila');
    toast(error ? 'Erro: ' + error.message : 'Publicação cancelada'); igDoPedido(j);
  }));
  if (emAndamento) setTimeout(() => S.aberto === j.id && $('#igPublicar') && igDoPedido(j), 8000);
}

const fmt = (n) => n == null ? '—' : Number(n).toLocaleString('pt-BR');
// desempenho de um post (S10): o worker atualiza a cada 6 h
function textoMetricas(p) {
  const m = p.metricas;
  if (!m) return p.metricas_erro ? `<span class="mute">${esc(p.metricas_erro)}</span>` : '<span class="mute">aguardando a 1ª leitura</span>';
  const partes = [m.alcance != null && `alcance ${fmt(m.alcance)}`, m.views != null && `${fmt(m.views)} views`, `${fmt(m.curtidas || 0)} curtidas`, `${fmt(m.comentarios || 0)} coment.`, m.salvos != null && `${fmt(m.salvos)} salvos`, m.compartilhamentos != null && `${fmt(m.compartilhamentos)} compart.`].filter(Boolean);
  return partes.join(' · ') + (m.parcial ? ' <span class="mute">(parcial)</span>' : '');
}

  $('#conteudo').innerHTML = `<div class="row" style="margin-bottom:12px"><h2 style="margin:0">Relatórios de performance</h2><span class="grow"></span><span class="small mute">Uso interno · só posts publicados pelo painel</span></div>

    <div class="box">${(rels || []).length ? `<table><tr><th>Pedido em</th><th>Cliente</th><th>Período</th><th>Status</th></tr>${rels.map((r) => `<tr class="click" data-id="${r.id}"><td>${quando(r.created_at)}</td><td>${esc(r.client_id ? nomeCliente(r.client_id) : 'Todos')}</td><td>${new Date(r.de + 'T12:00').toLocaleDateString('pt-BR')} a ${new Date(r.ate + 'T12:00').toLocaleDateString('pt-BR')}</td><td>${esc(ROTULO_REL[r.status] || r.status)}${r.erro ? ` <span class="small" style="color:#b91c1c">${esc(r.erro)}</span>` : ''}</td></tr>`).join('')}</table>` : '<div class="empty">Nenhum relatório ainda.</div>'}</div>`;

// ================= Publicações: agenda e resumo do dia =================
async function renderPublicacoes(dia) {
  const hoje = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  dia = dia || S.diaPub || hoje; S.diaPub = dia;
  const ini = new Date(dia + 'T00:00:00'), fim = new Date(ini.getTime() + 86400000), amanhaFim = new Date(fim.getTime() + 86400000);
  const desde = new Date(ini.getTime() - 13 * 86400000);
  const [{ data: pubs, error }, { data: contas }] = await Promise.all([
    sb.from('publicacoes').select('*').gte('agendada_para', desde.toISOString()).order('agendada_para', { ascending: false }).limit(500),
    sb.from('instagram_contas').select('id, username'),
  ]);
  if (error) { $('#conteudo').innerHTML = `<div class="box empty">Publicações ainda não liberadas no banco (migração 007).</div>`; return; }
  const arroba = (id) => '@' + ((contas || []).find((c) => c.id === id)?.username || '?');
  const job = (id) => S.jobs.find((j) => j.id === id);
  const peca = (p) => { const j = job(p.job_id); return j ? `${TIPO[j.tipo]} #${j.numero}` : 'pedido'; };
  const hora = (d) => new Date(d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const dataHora = (d) => new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const no = (d, a, b) => d && new Date(d) >= a && new Date(d) < b;
  const publicadas = (pubs || []).filter((p) => p.status === 'publicada' && no(p.publicada_em || p.agendada_para, ini, fim)).reverse();
  const erros = (pubs || []).filter((p) => p.status === 'erro' && no(p.agendada_para, ini, fim));
  const agendadas = (pubs || []).filter((p) => p.status === 'na_fila' && new Date(p.agendada_para) >= new Date()).sort((a, b) => new Date(a.agendada_para) - new Date(b.agendada_para));
  const amanha = agendadas.filter((p) => no(p.agendada_para, fim, amanhaFim));
  const diaTxt = ini.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  const linha = (p, quando) => `• ${nomeCliente(p.client_id)} · ${peca(p)} · ${arroba(p.conta_id)} · ${quando}${p.permalink ? ` · ${p.permalink}` : ''}${p.erro ? ` · erro: ${p.erro}` : ''}`;
  const resumo = [`Resumo das publicações · ${diaTxt}`, '',
    `Publicados (${publicadas.length}):`, ...(publicadas.length ? publicadas.map((p) => linha(p, hora(p.publicada_em || p.agendada_para))) : ['• nenhum']),
    ...(erros.length ? ['', `Com erro (${erros.length}):`, ...erros.map((p) => linha(p, hora(p.agendada_para)))] : []),
    '', `Agendados para o dia seguinte (${amanha.length}):`, ...(amanha.length ? amanha.map((p) => linha(p, hora(p.agendada_para))) : ['• nenhum'])].join('\n');
  const tab = (lst, quando, comMetricas) => lst.length ? `<table><tr><th>Quando</th><th>Cliente</th><th>Peça</th><th>Conta</th><th>Status</th>${comMetricas ? '<th>Desempenho</th>' : ''}</tr>${lst.map((p) => `<tr class="click" data-job="${p.job_id}"><td>${quando(p)}</td><td>${esc(nomeCliente(p.client_id))}</td><td>${esc(peca(p))}</td><td>${esc(arroba(p.conta_id))}</td><td>${p.permalink ? `<a href="${esc(p.permalink)}" target="_blank" rel="noopener">publicado</a>` : esc(STATUS_PUB[p.status] || p.status)}${p.erro ? ` <span class="small" style="color:#b91c1c">${esc(p.erro)}</span>` : ''}</td>${comMetricas ? `<td class="small">${textoMetricas(p)}</td>` : ''}</tr>`).join('')}</table>` : '<div class="small mute" style="padding:12px">Nada por aqui.</div>';
  $('#conteudo').innerHTML = `<div class="row" style="margin-bottom:12px"><h2 style="margin:0">Publicações</h2><span class="grow"></span><label class="small">Dia <input type="date" id="diaPub" value="${dia}" max="${hoje}" style="width:auto"></label></div>
    <div class="grid2">
      <div><h3 style="margin-top:0">Resumo do dia</h3><div class="box pad"><pre id="resumoPub" style="white-space:pre-wrap;margin:0;font-family:inherit;font-size:14px">${esc(resumo)}</pre>
        <div class="row" style="margin-top:10px"><span class="grow"></span><button class="btn sm" id="copiarResumo">Copiar para o WhatsApp</button></div></div>
        <h3>Agendadas</h3><div class="box">${tab(agendadas, (p) => dataHora(p.agendada_para))}</div></div>
      <div><h3 style="margin-top:0">Publicadas em ${diaTxt}</h3><div class="box">${tab(publicadas, (p) => hora(p.publicada_em || p.agendada_para), true)}</div>
        ${erros.length ? `<h3>Com erro em ${diaTxt}</h3><div class="box">${tab(erros, (p) => hora(p.agendada_para))}</div>` : ''}</div>
    </div>`;
  $('#diaPub').onchange = (e) => renderPublicacoes(e.target.value);
  $('#copiarResumo').onclick = () => navigator.clipboard.writeText($('#resumoPub').innerText).then(() => toast('Resumo copiado'));
  $$('#conteudo tr.click').forEach((tr) => (tr.onclick = (ev) => { if (ev.target.closest('a')) return; if (tr.dataset.job && tr.dataset.job !== 'null') abrirPedido(tr.dataset.job); }));
}

// Reels do sistema e de editor misturados; quem vota não sabe a origem (a coluna nem chega ao navegador).
const embaralhar = (lista, semente) => lista.map((x) => { let h = 2166136261; for (const ch of semente + x.id) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return [h >>> 0, x]; }).sort((a, b) => a[0] - b[0]).map((x) => x[1]);
async function renderTeste() {
  const admin = S.perfil.papel === 'admin';

  S.rodada = S.rodada && rodadas.includes(S.rodada) ? S.rodada : rodadas[rodadas.length - 1] || '1';
  const reels = embaralhar((rr.data || []).filter((r) => r.rodada === S.rodada), S.perfil.id);
  const votos = Object.fromEntries((rv.data || []).map((v) => [v.reel_id, v]));
  const feitos = reels.filter((r) => votos[r.id]).length;
  const opc = (nome, valor, lista) => lista.map(([v, t]) => `<label class="small" style="display:block"><input type="radio" name="${nome}" value="${v}" ${valor === v ? 'checked' : ''}> ${t}</label>`).join('');
  $('#conteudo').innerHTML = `<h2>Teste às cegas</h2>
    <p class="mute" style="margin-top:-6px">Alguns reels foram editados pelo sistema e outros por editor. Assista e responda como se fosse postar hoje. Ninguém vê o seu voto, e o resultado só aparece para o admin.</p>
    <div class="row" style="margin-bottom:12px">${rodadas.length > 1 ? `<select id="selRodada" style="width:auto">${rodadas.map((r) => `<option ${r === S.rodada ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>` : ''}
      <span class="tag ${feitos === reels.length && reels.length ? 's-ok' : 's-voce'}">Você avaliou ${feitos} de ${reels.length}</span></div>
    ${reels.length ? `<div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(290px,1fr))">${reels.map((r, i) => { const v = votos[r.id] || {}; return `<form class="card teste" data-id="${r.id}">
      <b>Reel ${i + 1}</b>
      <div class="previa" style="margin:8px 0"><iframe src="https://drive.google.com/file/d/${esc(r.drive_id)}/preview" style="width:100%;aspect-ratio:9/16;border:0;border-radius:10px" allow="autoplay" loading="lazy"></iframe></div>
      <label class="f" style="margin-top:4px">Postaria assim?</label>${opc('postaria', v.postaria, [['sim', 'Sim, do jeito que está'], ['ajuste', 'Com um ajuste pequeno'], ['nao', 'Não postaria']])}
      <label class="f">Nota</label><select name="nota">${['', 1, 2, 3, 4, 5].map((n) => `<option value="${n}" ${String(v.nota || '') === String(n) ? 'selected' : ''}>${n || '—'}</option>`).join('')}</select>
      <label class="f">Quem você acha que editou?</label>${opc('palpite', v.palpite || '', [['sistema', 'Sistema'], ['editor', 'Editor'], ['', 'Não sei']])}
      <label class="f">Comentário (opcional)</label><textarea name="comentario" style="min-height:52px" placeholder="O que mudaria?">${esc(v.comentario || '')}</textarea>
      <div class="row" style="margin-top:8px"><span class="small mute">${v.id ? 'Avaliado' : ''}</span><span class="grow"></span><button class="btn sm acc">${v.id ? 'Atualizar' : 'Salvar'}</button></div></form>`; }).join('')}</div>`
      : '<div class="box empty">Nenhum reel nesta rodada ainda.</div>'}
    ${admin ? `<h3>Admin</h3><div class="grid2">
      <form class="box pad" id="fTeste"><b>Incluir reel no teste</b>
        <label class="f">Link do vídeo no Drive</label><input name="link" required placeholder="https://drive.google.com/file/d/...">
        <div class="grid3"><div><label class="f">Quem editou</label><select name="origem"><option value="editor">Editor</option><option value="sistema">Sistema</option></select></div>
          <div><label class="f">Cliente</label><select name="cliente"><option value="">—</option>${S.clientes.map((c) => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
          <div><label class="f">Rodada</label><input name="rodada" value="${esc(S.rodada)}"></div></div>
        <p class="small mute">O vídeo precisa abrir para quem vota (pasta da Link 3 ou link "qualquer pessoa com o link"). Reels do sistema também entram pelo botão "Pôr no teste às cegas" no pedido entregue.</p>
        <div class="row"><span class="grow"></span><button class="btn acc">Incluir</button></div></form>
      <div class="box pad" id="resTeste"><b>Resultado da rodada ${esc(S.rodada)}</b><div class="small mute">Carregando…</div></div></div>` : ''}`;
  $('#selRodada') && ($('#selRodada').onchange = (e) => { S.rodada = e.target.value; renderTeste(); });
  $$('form.teste').forEach((f) => (f.onsubmit = async (e) => {
    e.preventDefault();
    const postaria = f.querySelector('input[name=postaria]:checked')?.value, nota = Number(f.nota.value);
    if (!postaria || !nota) return toast('Responda "postaria assim?" e a nota');
    const { error } = await sb.from('teste_votos').upsert({ reel_id: f.dataset.id, user_id: S.perfil.id, postaria, nota, palpite: f.querySelector('input[name=palpite]:checked')?.value || null, comentario: f.comentario.value.trim() || null }, { onConflict: 'reel_id,user_id' });
    toast(error ? 'Erro: ' + error.message : 'Avaliação salva'); if (!error) renderTeste();
  }));
  if (!admin) return;
  $('#fTeste').onsubmit = async (e) => {
    e.preventDefault(); const f = e.target; const id = idDrive(f.link.value);
    if (!id) return toast('Cole o link do vídeo');
    const { error } = await sb.from('teste_reels').insert({ drive_id: id, origem: f.origem.value, client_id: f.cliente.value || null, rodada: f.rodada.value.trim() || '1' });
    toast(error ? 'Erro: ' + error.message : 'Reel incluído'); if (!error) { S.rodada = f.rodada.value.trim() || '1'; renderTeste(); }
  };
  const [{ data: res, error: e1 }, { data: gab }] = await Promise.all([sb.rpc('resultado_teste', { p_rodada: S.rodada }), sb.rpc('teste_gabarito', { p_rodada: S.rodada })]);
  const pct = (n) => (n == null ? '—' : String(n).replace('.', ',') + '%');
  const sis = (res || []).find((x) => x.origem === 'sistema');
  const num = Object.fromEntries(reels.map((r, i) => [r.id, i + 1]));
  $('#resTeste').innerHTML = `<b>Resultado da rodada ${esc(S.rodada)}</b>${e1 ? `<div class="small" style="color:var(--red)">${esc(e1.message)}</div>` : ''}
    <table style="margin-top:8px"><tr><th>Quem editou</th><th class="num">Reels</th><th class="num">Votos</th><th class="num">Postaria</th><th class="num">Com ajuste</th><th class="num">Nota</th><th class="num">Acerto do palpite</th></tr>
    ${(res || []).map((x) => `<tr><td>${x.origem === 'sistema' ? 'Sistema' : 'Editor'}</td><td class="num">${x.reels}</td><td class="num">${x.votos}</td><td class="num">${pct(x.postaria_pct)}</td><td class="num">${pct(x.ajuste_pct)}</td><td class="num">${x.nota_media == null ? '—' : String(x.nota_media).replace('.', ',')}</td><td class="num">${pct(x.acerto_palpite_pct)}</td></tr>`).join('')}</table>
    <p class="small" style="margin:8px 0 0">${sis?.votos ? `Meta do projeto: 80% dos reels do sistema com "postaria assim". Hoje: <b>${pct(sis.postaria_pct)}</b> ${Number(sis.postaria_pct) >= 80 ? '✓' : ''}. Acerto do palpite perto de 50% = a equipe não distingue sistema de editor.` : 'Sem votos ainda.'}</p>
    <h3>Reels da rodada</h3>${(gab || []).map((g) => `<div class="ativo"><span style="width:62px">Reel ${num[g.id] || '?'}</span><span class="tag ${g.origem === 'sistema' ? 's-rodando' : 's-fila'}">${g.origem}</span><span class="small mute" style="flex:1">${g.votos} votos · postaria ${pct(g.postaria_pct)} · nota ${g.nota_media == null ? '—' : String(g.nota_media).replace('.', ',')}</span><button class="btn sm red delReel" data-id="${g.id}">Tirar</button></div>`).join('') || '<div class="small mute">Nenhum.</div>'}
    <p class="small mute">A numeração "Reel N" é a da sua tela (cada pessoa vê os reels em ordem diferente).</p>`;
  $$('.delReel').forEach((b) => (b.onclick = async () => { const { error } = await sb.from('teste_reels').delete().eq('id', b.dataset.id); toast(error ? 'Erro: ' + error.message : 'Reel retirado'); renderTeste(); }));
}

$('#dlg').addEventListener('close', () => { S.aberto = null; });
iniciar();
</script>
</body>
</html>
